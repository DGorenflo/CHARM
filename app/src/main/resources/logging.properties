# Console handler is required — LogManager.readConfiguration() in Main.java resets
# the JUL config, dropping the default ConsoleHandler. Without this line the root
# logger has no handler and INFO logs are silently discarded.
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Root logger: only WARNING and above
.level=WARNING

# Our matcher package: INFO for token summary and job progress
tim.level=INFO

# Suppress Jena and other verbose libraries
org.apache.jena.level=WARNING
com.hp.hpl.level=WARNING
